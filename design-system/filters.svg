<!-- PAPER SKETCH DESIGN SYSTEM — filtros SVG obrigatórios.
     Injete este bloco uma única vez no DOM (logo após <body> ou no root do React).
     Sem ele, as bordas wobbly aparecem retas. -->
<svg style="position: absolute; width: 0; height: 0;" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Sutil: inputs, tags, botões pequenos, ícones -->
    <filter id="hand-drawn-subtle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <!-- Médio: cards, header, painéis -->
    <filter id="hand-drawn" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <!-- Pesado: marca-texto, sublinhados, rabiscos decorativos -->
    <filter id="hand-drawn-heavy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>
